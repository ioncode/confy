name: Go CI/CD

on:
  push:
    branches: [ main ]
    tags:
      - 'v*' # Запускает процесс CD при создании тегов (например, v1.0.0, v1.1.0)
  pull_request:
    branches: [ main ]

permissions:
  contents: write # Разрешает GitHub Actions создавать релизы и загружать прикрепленные файлы

jobs:
  # 1. Этап линтинга (Проверка качества и стиля кода)
  lint:
    name: Runner / Linter
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  # 2. Этап тестирования (Запускается на разных версиях Go)
  test:
    name: Runner / Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        go-version: ['1.25', '1.26'] # Тестирование на текущей и прошлой стабильных версиях
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run Unit Tests & Benchmarks
        run: |
          go test -v -race -bench=. -benchmem -covermode=atomic -coverprofile=coverage.out ./...

      - name: Check Coverage Report
        run: go tool cover -func=coverage.out

  # 3. Этап публикации релиза (CD) — Только при создании Git-тега v*
  release:
    name: Release / Deployment
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') # Условие: выполнять только для тегов версий
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Требуется для автоматической генерации списка изменений (Changelog)

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # Автоматическое создание страницы релиза на GitHub
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true # GitHub автоматически соберет список PR и коммитов
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Встроенный секретный токен GitHub

      # Принудительный «прогрев» Go Proxy для мгновенного обновления пакета на pkg.go.dev
      - name: Publish to Go Proxy & pkg.go.dev
        run: |
          MODULE_NAME=$(go list -m)
          TAG_NAME="${{ github.ref_name }}"
          
          echo "Публикация модуля $MODULE_NAME версии $TAG_NAME в официальный Go Proxy..."
          
          # Переводим имя модуля в нижний регистр согласно спецификации Go пакетов
          LOWER_MODULE=$(echo "$MODULE_NAME" | tr '[:upper:]' '[:lower:]')
          curl -i "https://golang.org{LOWER_MODULE}/@v/${TAG_NAME}.info"
